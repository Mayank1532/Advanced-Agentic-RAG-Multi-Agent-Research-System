[project]
name = "advanced-agentic-rag-multi-agent-research-system"
version = "0.1.0"
description = "Local advanced RAG and multi-agent research system using LangGraph"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faiss-cpu>=1.12.0",
    "langgraph>=0.6.0",
    "numpy>=2.0,<3.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.0.0",
    "torch>=2.13.0",
    "transformers>=5.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_rag"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
